<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">How ZRKC works</title>
  <desc id="d">The Zwift Ride controllers talk to the phone over Bluetooth; the phone drives the KICKR CORE over Bluetooth, reads an optional heart rate monitor, controls the music and sends the FIT file to COROS on request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#E4002B"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8C8C8C"/>
    </marker>
  </defs>
  <rect width="1280" height="560" rx="28" fill="#101820"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Ligne principale : Ride → téléphone → KICKR -->
    <g>
      <rect x="60" y="80" width="300" height="170" rx="20" fill="#1C1C1C" stroke="#3A3A3A"/>
      <!-- Deux manettes stylisées -->
      <g fill="#E6E6E6">
        <rect x="150" y="104" width="34" height="66" rx="14"/>
        <rect x="236" y="104" width="34" height="66" rx="14"/>
      </g>
      <g fill="#E4002B">
        <circle cx="167" cy="124" r="5"/><circle cx="167" cy="146" r="5"/>
        <circle cx="253" cy="124" r="5"/><circle cx="253" cy="146" r="5"/>
      </g>
      <text x="210" y="208" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">Zwift Ride</text>
      <text x="210" y="234" text-anchor="middle" font-size="17" fill="#BDBDBD">two controllers</text>
    </g>

    <g>
      <rect x="490" y="50" width="300" height="230" rx="24" fill="#2A0008" stroke="#E4002B" stroke-width="2"/>
      <!-- Téléphone stylisé et pignon -->
      <rect x="610" y="74" width="60" height="104" rx="12" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <g transform="translate(640 126) scale(0.5) translate(-54 -54)" fill="#E4002B">
        <path d="M54,30a24,24 0,1 1,0 48a24,24 0,1 1,0 -48zM54,42a12,12 0,1 0,0 24a12,12 0,1 0,0 -24z"/>
        <g transform="rotate(22 54 54)"><path d="M51,24h6v8h-6zM51,76h6v8h-6zM24,51h8v6h-8zM76,51h8v6h-8z"/></g>
      </g>
      <text x="640" y="214" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF">ZRKC</text>
      <text x="640" y="240" text-anchor="middle" font-size="17" fill="#FFDAD6">Android phone</text>
      <text x="640" y="262" text-anchor="middle" font-size="15" fill="#BDBDBD">gears · grade · ERG · ride log</text>
    </g>

    <g>
      <rect x="920" y="80" width="300" height="170" rx="20" fill="#1C1C1C" stroke="#3A3A3A"/>
      <!-- Home trainer stylisé : volant et pignon -->
      <circle cx="1070" cy="140" r="38" fill="none" stroke="#E6E6E6" stroke-width="6"/>
      <circle cx="1070" cy="140" r="10" fill="#E4002B"/>
      <path d="M1030 182h80" stroke="#E6E6E6" stroke-width="6" stroke-linecap="round"/>
      <text x="1070" y="214" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">KICKR CORE</text>
      <text x="1070" y="240" text-anchor="middle" font-size="17" fill="#BDBDBD">with Zwift Cog</text>
    </g>

    <!-- Flèches principales -->
    <path d="M368 150H482" stroke="#E4002B" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="425" y="134" text-anchor="middle" font-size="15" fill="#E6E6E6">buttons</text>
    <text x="425" y="176" text-anchor="middle" font-size="13" fill="#8C8C8C">Bluetooth LE</text>

    <path d="M798 138H912" stroke="#E4002B" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="855" y="122" text-anchor="middle" font-size="15" fill="#E6E6E6">resistance</text>
    <path d="M912 168H798" stroke="#8C8C8C" stroke-width="3" marker-end="url(#arrowGrey)"/>
    <text x="855" y="194" text-anchor="middle" font-size="15" fill="#E6E6E6">power, cadence</text>
    <text x="855" y="214" text-anchor="middle" font-size="13" fill="#8C8C8C">Bluetooth LE</text>

    <!-- Branches secondaires -->
    <path d="M560 288V368" stroke="#8C8C8C" stroke-width="3" marker-start="url(#arrowGrey)"/>
    <path d="M720 288V368" stroke="#8C8C8C" stroke-width="3"/>
    <path d="M560 368H250V400" fill="none" stroke="#8C8C8C" stroke-width="3"/>
    <path d="M720 368H1030V392" fill="none" stroke="#8C8C8C" stroke-width="3" marker-end="url(#arrowGrey)"/>
    <path d="M640 288V392" stroke="#8C8C8C" stroke-width="3" marker-end="url(#arrowGrey)"/>

    <g>
      <rect x="100" y="400" width="300" height="110" rx="18" fill="#141414" stroke="#3A3A3A"/>
      <path d="M182 432c-10-12-30-4-26 12c3 12 26 26 26 26s23-14 26-26c4-16-16-24-26-12z" fill="#E4002B"/>
      <text x="290" y="448" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Heart rate</text>
      <text x="290" y="474" text-anchor="middle" font-size="15" fill="#BDBDBD">any standard BLE strap</text>
      <text x="290" y="494" text-anchor="middle" font-size="13" fill="#8C8C8C">optional</text>
    </g>
    <g>
      <rect x="490" y="400" width="300" height="110" rx="18" fill="#141414" stroke="#3A3A3A"/>
      <path d="M574 430v38" stroke="#E4002B" stroke-width="5" stroke-linecap="round"/>
      <circle cx="566" cy="470" r="9" fill="#E4002B"/>
      <path d="M574 430l18 6" stroke="#E4002B" stroke-width="5" stroke-linecap="round"/>
      <text x="680" y="448" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Music</text>
      <text x="680" y="474" text-anchor="middle" font-size="15" fill="#BDBDBD">play, skip, seek, volume</text>
      <text x="680" y="494" text-anchor="middle" font-size="13" fill="#8C8C8C">Spotify first</text>
    </g>
    <g>
      <rect x="880" y="400" width="300" height="110" rx="18" fill="#141414" stroke="#3A3A3A"/>
      <path d="M948 470a16 16 0 0 1 2-32a22 22 0 0 1 42 6a13 13 0 0 1-2 26z" fill="none" stroke="#E4002B" stroke-width="4"/>
      <text x="1070" y="448" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">COROS</text>
      <text x="1070" y="474" text-anchor="middle" font-size="15" fill="#BDBDBD">FIT file, one tap</text>
      <text x="1070" y="494" text-anchor="middle" font-size="13" fill="#8C8C8C">only network use</text>
    </g>
  </g>
</svg>
